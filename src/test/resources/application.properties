spring.application.name=sistema-adopcion-mascotas-test

# Base de datos en memoria para pruebas
spring.datasource.url=jdbc:h2:mem:adopcion_mascotas_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate para pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT de prueba
jwt.secret=secreto_test_seguro_para_pruebas_unitarias_2026_con_largo_suficiente
jwt.expiration=3600000

# Reducir ruido en logs de test
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR

# Manejo seguro de errores en pruebas
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false